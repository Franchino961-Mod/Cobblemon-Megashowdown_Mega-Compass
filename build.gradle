plugins {
    id 'fabric-loom' version '1.8.13'
    id 'maven-publish'
}

version = project.mod_version
archivesBaseName = "${project.archives_base_name}-fabric-mc${project.minecraft_version}"
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://maven.impactdev.net/repository/development/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // CobblemonMegaShowdown - richiesta per le strutture (megaroid, mega_site, wishing_weald)
    // Decommentare e impostare mega_showdown_version in gradle.properties quando disponibile su maven
    // modCompileOnly "com.mega_showdown:fabric:${project.mega_showdown_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}